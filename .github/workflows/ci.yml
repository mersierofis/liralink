name: CI

# One job per app, each run only when that app's folder (or this workflow) changes.
# A job is skipped while its app has no package.json yet, so empty folders never fail CI.
# Every app must define the npm scripts `typecheck`, `lint` and `build`; the backend also `test`.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.pkg.outputs.backend == 'true' }}
      merchant-web: ${{ steps.filter.outputs.merchant-web == 'true' && steps.pkg.outputs.merchant-web == 'true' }}
      pay-web: ${{ steps.filter.outputs.pay-web == 'true' && steps.pkg.outputs.pay-web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            merchant-web:
              - 'merchant-web/**'
              - '.github/workflows/ci.yml'
            pay-web:
              - 'pay-web/**'
              - '.github/workflows/ci.yml'
      - id: pkg
        name: Detect apps with a package.json
        run: |
          for app in backend merchant-web pay-web; do
            if [ -f "$app/package.json" ]; then echo "$app=true"; else echo "$app=false"; fi >> "$GITHUB_OUTPUT"
          done

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  merchant-web:
    needs: changes
    if: needs.changes.outputs.merchant-web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: merchant-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  pay-web:
    needs: changes
    if: needs.changes.outputs.pay-web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pay-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pay-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
